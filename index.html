var a = prompt("Число 1 ");
var b = prompt("Число 2 ");
d=multiply(a,b) ;

   function multiply(num1,num2) 
{
  var result = num1 * num2;

  return result;
}

function summa(num1,num2){
  let result = num1 + num2
  return result;
}

let c = Math.floor (Math.random()* 10)
let f = Math.floor (Math.random()* 10)
s = summa(c,f);
let t = prompt(c + "+" + f + "=" + "?")
if(s === Number(t)){
  alert("Правильно это: " + s + " +++++")

}
else{
  alert("Неправильно это: " + s + " -------")
}




</script>
